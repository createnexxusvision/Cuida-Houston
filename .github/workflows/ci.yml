name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Migrate, seed and run the end-to-end check
        working-directory: services/etl
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          WEB_DB_PASSWORD: ci-web-reader-pass
          OWNER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          WEB_DATABASE_URL: postgres://cuida_web:ci-web-reader-pass@localhost:5432/postgres
        run: |
          node src/migrate.js --seed
          node test/e2e-local.mjs
