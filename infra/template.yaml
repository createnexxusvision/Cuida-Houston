AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Cuida HOU: nightly data pipeline (Lambda + EventBridge Scheduler) and a failure alarm.
  Database is Neon Postgres (PostGIS), reached over the internet via DATABASE_URL — no VPC,
  no AWS-managed database. Amplify's web app also connects with DATABASE_URL, set directly
  in the Amplify console; there is no compute role for it in this stack.

Parameters:
  AlertEmail:
    Type: String
    Description: Email for pipeline failure alarms
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Neon Postgres connection string (pooled), e.g. postgresql://user:pass@host/db?sslmode=require

Resources:
  # Census + data.texas.gov keys. Set real values after deploy (see infra/README.md).
  AppKeysSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: cuida-hou/app-keys
      Description: CENSUS_API_KEY and SOCRATA_APP_TOKEN for the pipeline
      SecretString: '{"CENSUS_API_KEY":"REPLACE_ME","SOCRATA_APP_TOKEN":"REPLACE_ME"}'

  # ---------------- Pipeline ----------------
  EtlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cuida-hou-etl
      CodeUri: ../services/etl/
      Handler: src/handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          APP_SECRET_ARN: !Ref AppKeysSecret
          COUNTY: HARRIS
          ACS_YEAR: '2024'
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AppKeysSecret
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 3 * * ? *)
            ScheduleExpressionTimezone: America/Chicago
            RetryPolicy:
              MaximumRetryAttempts: 1

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  EtlErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Cuida HOU pipeline failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EtlFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  AppKeysSecretArn:
    Value: !Ref AppKeysSecret
  EtlFunctionName:
    Value: !Ref EtlFunction
