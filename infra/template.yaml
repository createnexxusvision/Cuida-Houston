AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cuida HOU nightly data pipeline (HHSC licensing + Census -> Supabase)

Parameters:
  SecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CENSUS_API_KEY, SOCRATA_APP_TOKEN
  AlertEmail:
    Type: String
    Description: Email for failure alarms

Resources:
  EtlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cuida-hou-etl
      CodeUri: ../services/etl/
      Handler: src/handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          SECRET_ARN: !Ref SecretArn
          COUNTY: HARRIS
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SecretArn
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 3 * * ? *)
            ScheduleExpressionTimezone: America/Chicago
            RetryPolicy:
              MaximumRetryAttempts: 1

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  EtlErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Cuida HOU ETL failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EtlFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  EtlFunctionName:
    Value: !Ref EtlFunction
