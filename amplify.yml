version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || true
            # npm workspaces: install from the repo root (single lockfile), then return to apps/web
            - cd ../.. && npm ci && cd apps/web
        build:
          commands:
            # Amplify does not pass console env vars to the SSR runtime; write it for Next.js to pick up.
            # DATABASE_URL is a real secret (Neon connection string) - set it in the Amplify console as
            # a protected/secret env var, never commit it, never echo it in build logs.
            - env | grep -E '^DATABASE_URL=' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
