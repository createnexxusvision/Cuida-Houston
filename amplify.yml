version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || true
            # npm workspaces: install from the repo root (single lockfile), then return to apps/web
            - cd ../.. && npm ci && cd apps/web
        build:
          commands:
            # Amplify does not pass console env vars to the SSR runtime; write the non-secret ones for Next.js.
            # These are ARNs, not passwords. Access comes from the SSR compute role (IAM), not from keys.
            - env | grep -E '^(DB_CLUSTER_ARN|DB_SECRET_ARN|DB_NAME|AWS_REGION)=' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
